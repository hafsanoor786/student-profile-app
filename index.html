<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <img class="img"
        src="https://img.magnific.com/premium-psd/graduation-cap-with-tassel-isolated-transparent-background-high-quality-png_775582-15797.jpg?semt=ais_hybrid&w=740&q=80e"
        alt="profile" height="200">
    <h1 class="heading">Students Profile App</h1>
    <p class="para">Add students view their details and manage your list!</p>
    <div class="form">
        <label class="lbl">Student Name</label>
        <br>
        <input class="input" placeholder="Enter your name">
        <br>
        <label class="lbl2">Age</label>
        <br>
        <input class="input2" placeholder="Enter your age">
        <br>
        <label class="lbl3">Select an options</label>
        <br>
        <select class="select">
            <option>Select an option</option>
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
            <option>React</option>
        </select>
        <br>
        <button class="btn">Add Students</button>
        <button class="btn2">Clear All</button>
        <p id="counter">Total Students: 0</p>
        <div id="studentContainer"></div>
    </div>

    <script src="javascript.js"></script>
</body>

</html>
